name: Google Doc Randomizer Bot

on:
  # Allows you to run it manually from the GitHub Actions tab
  workflow_dispatch:
  # Optional: Run it automatically on a schedule (e.g., every day at midnight UTC)
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Run Python script
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: python edit_doc.py
