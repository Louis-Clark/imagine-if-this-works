name: Google Doc Glitch Bot

on:
  workflow_dispatch: # Keeps the manual "Run workflow" button active on GitHub
  repository_dispatch:
    types: [trigger-bot] # Matches the event_type sent by your external cron service

jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth numpy

      - name: Run Python script
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: python edit_doc.py
